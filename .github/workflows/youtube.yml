name: yt-agent

on:
  schedule:
    - cron: 0 9 * * *
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get skills
        run: git clone https://github.com/Jakeschincariol/youtube-agent-skill.git /tmp/yt

      - name: Run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p output
          p
