name: yt-agent

on:
  schedule:
    - cron: 0 9 * * *
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get skills
        run: git clone https://github.com/Jakeschincariol/youtube-agent-skill.git /tmp/yt

      - name: Make folder
        run: mkdir -p output

      - name: Run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TASK: Plan this week of uploads for my channel
        run: python3 .github/workflows/run.py yt-plan "$TASK" > output/plan.md

      - name: Save result
        run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add output
          git commit -m daily-output || exit 0
          git push
